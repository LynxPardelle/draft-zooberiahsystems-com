name: PR safety

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  pr-safety:
    uses: LynxPardelle/zoolandingpage/.github/workflows/reusable-pr-safety.yml@c8b04670b5cca800ccf0f723815813897e596600

  draft-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/qa-contract.test.mjs
